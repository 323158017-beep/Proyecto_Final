<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>
    <h1>Registrar Paciente</h1>

    <select id="tipo">
        <option value="externo">Externo</option>
        <option value="hospitalizado">Hospitalizado</option>
    </select>
    <br><br>

    Expediente: <input id="exp"><br><br>
    Nombre: <input id="nom"><br><br>
    Dias: <input id="dias" type="number"><br><br>

    Tarifa (solo externo): <input id="tarifa" type="number"><br><br>
    Costo por dia (solo hospitalizado): <input id="costo" type="number"><br><br>
    Insumos (solo hospitalizado): <input id="insumos" type="number"><br><br>

    <button onclick="registrar()">Registrar</button>
    <br><br>
    <a href="../index.html">Volver</a>

    <script src="../js/Paciente.js"></script>
    <script src="../js/PacienteExterno.js"></script>
    <script src="../js/PacienteHospitalizado.js"></script>
    <script src="../js/SalaHospital.js"></script>
    <script src="../js/Aplicacion.js"></script>
</body>
</html>
